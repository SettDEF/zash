[package]
name = "zash"
description = "zash — the zett terminal"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
alacritty_terminal = "0.26"
glyphon = "0.12"
wgpu = { version = "30", features = ["glsl"] }
winit = "0.30"
pollster = "0.4"
log = "0.4"
png = "0.17"
# Lottie animations (anim.rs): velato reads them, vello_cpu draws the frames
velato = { version = "0.12", default-features = false }
vello_cpu = "0.3"
# SVG pictures (VectorCraft) on the same escape: drawn once by resvg
resvg = { version = "0.45", default-features = false, features = ["text", "system-fonts"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
rmpv = "1"
wayland-client = "0.31"
wayland-backend = { version = "0.3", features = ["client_system"] }
libc = "0.2"
# --desktop: a layer-shell surface (on the wallpaper), sized for fractional scales
wayland-protocols = { version = "0.32", features = ["client", "staging", "unstable"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
raw-window-handle = "0.6"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
